
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<link rel="stylesheet" type="text/css" th:href="@{/compartilhado/css/forms.css}"/>
<link rel="stylesheet" type="text/css" th:href="@{/compartilhado/css/print.css}" media="print">
<script type="text/javascript" th:src="@{/compartilhado/js/funcoesFluxo.js}" th:inline="javascript"></script>
<script type="text/javascript" th:src="@{/compartilhado/js/funcoesCadastro.js}" th:inline="javascript"></script>
<link rel="stylesheet" th:href="@{/compartilhado/css/principal.css}" />
</head>
<body>

<table class="tabTitForm"><tr>
<td>
<span class="stlTitForm">CADASTRO DE AGENDA</span>
</td>
<td style="text-align:right;"><span class="stlCodForm">CadAgeEdit</span></td>
</tr></table>

<p><b>EMPRESA: </b><span id="a_A01_NOME"></span></p>
<form id="CadastroAgendaForm" action="#" method="post" autocomplete="off">
<span id="a_Mensagens" style="display:none; color:red;"></span>
<input type="hidden" name="ct_A04_CODIGO" id="ct_A04_CODIGO" value="" /><br/>
<table><tr>
<td><label for="a_a04_titulo">Título: </label>
</td><td><input type="text" name="a_a04_titulo" id="a_a04_titulo" value="" /><br/>
</td></tr><tr>
<td><label for="a_a04_descricao">Descrição: </label>
</td><td><textarea name="a_a04_descricao" id="a_a04_descricao" rows="4" cols="40"></textarea><br/>
</td></tr>
</table>
<input type="checkbox" name="a_a04_status_dt_limite" 
	id="a_a04_status_dt_limite" value="1" onchange="ctrlVisualDataLimite();" />
<label for="a_a04_status_dt_limite"> - com Data Limite</label><br/>
<span id="a_cmpDataLimite" style="display:none;">
<label for="a_a04_data_limite">Data Limite: </label>
<input type="date" name="a_a04_data_limite" id="a_a04_data_limite" value="" /><br/>
</span>
<hr><br/>
<input type="button" id="salvar" value="Salvar e Sair" onclick="salvarCadastroAgenda(2)" />
<input type="button" id="cancelar" value="Cancelar e Sair" onclick="cancelarCadastroAgenda(2)" />
<br/>
<th:block th:replace="~{compartilhado/camposControle :: conteudo}"></th:block>

</form>
<script type="text/javascript" th:inline="javascript">
document.getElementById("ct_A04_CODIGO").value = [[${pagina.ct_A04_CODIGO}]];
document.getElementById("a_a04_titulo").value = [[${pagina.ct_A04_TITULO}]];
document.getElementById("a_a04_descricao").value = [[${pagina.ct_A04_DESCRICAO}]];
var statusDataLimiteAgendaControle = [[${pagina.ct_A04_STATUS_DT_LIMITE}]];
var containerDataLimite = document.getElementById("a_cmpDataLimite");
if (statusDataLimiteAgendaControle == "1") {
	document.getElementById("a_a04_status_dt_limite").checked = true;
	containerDataLimite.style.display = "inline";
} else {
	document.getElementById("a_a04_status_dt_limite").checked = false;
	containerDataLimite.style.display = "none";
}
document.getElementById("a_a04_data_limite").value = [[${pagina.ct_A04_DATA_LIMITE}]];
//----------------------------------------------------
var nomeEmpresaFormularioAgenda = document.getElementById("a_A01_NOME");
nomeEmpresaFormularioAgenda.innerHTML = document.getElementById("ct_A01_NOME").value;
</script>
</body>
</html>
