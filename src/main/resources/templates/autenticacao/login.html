
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.css}" />
<link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}" />
<link rel="stylesheet" th:href="@{/compartilhado/css/principal.css}" />
<script type="text/javascript" th:src="@{/autenticacao/js/funcoesLogin.js}" th:inline="javascript"></script>
</head>
<body>

<div class="card" id="telaLogin">
  <div class="card-body">
  <form id="pdLoginForm" action="../autenticacao/login" method="post">
  <div class="mb-3">
    <label class="form-label">Usuário: </label>
    <input type="text" name="pdUsuario" id="pdUsuario" th:value="${pagina.txt_pdUsuario}" class="form-control" placeholder="Digite seu Usuário..." />
  </div>
  <div class="mb-3">
    <label class="form-label">Senha</label>
    <input type="password" name="pdSenha" id="pdSenha" onkeypress="submeterForm(1, event);" value="" class="form-control" placeholder="Digite sua Senha..." />
  </div>
  <button type="button" onclick="enviarPdLogin(1);" class="btn btn-paradecision btn-block">Enviar</button>
  <div id="pdMensagens" th:style="${'display:' + pagina.txt_pdMsgDisplay + ';'}"><br/><th:block th:text="${pagina.txt_pdMensagens}"></th:block></div>
  <th:block th:replace="~{compartilhado/camposControle :: conteudo}"></th:block>
  </form>
  </div>
</div>
<script type="text/javascript" th:inline="javascript">
var jsUsuSessao = [[${pagina.oUsuarioModel_A02_nome}]];
if (jsUsuSessao == "null") jsUsuSessao = "";
if (jsUsuSessao != "") {
	var txtAux = "";
	var sess_pdUsuSessao = parent.document.getElementById("pdUsuSessao"); 
	var sess_pdNomeUsuSessao = parent.document.getElementById("pdNomeUsuSessao"); 
	var sess_pdUsuPerfil = parent.document.getElementById("pdUsuPerfil"); 
	sess_pdUsuSessao.value = [[${pagina.oUsuarioModel_A02_usuario}]];
	sess_pdNomeUsuSessao.value = [[${pagina.oUsuarioModel_A02_nome2}]];
	sess_pdUsuPerfil.value = "Analista";
	// ###### Preenchendo Campos de Controle ######
	var qtdEmpresas = [[${pagina.qtdEmpresas}]];
	txtAux = [[${pagina.oUsuarioModel_A02_codigo}]];
	document.getElementById("ct_A02_CODIGO").value = txtAux;
	txtAux = [[${pagina.oUsuarioModel_A02_usuario2}]];
	document.getElementById("ct_A02_USUARIO").value = txtAux;
	document.getElementById("ct_QTD_EMPRESAS").value = qtdEmpresas;
	if (qtdEmpresas == "1") {
		txtAux = [[${pagina.oEmpresaModel_A01_codigo}]];
		document.getElementById("ct_A01_CODIGO").value = txtAux;
		txtAux = [[${pagina.oEmpresaModel_A01_nome}]];
		document.getElementById("ct_A01_NOME").value = txtAux;
		txtAux = [[${pagina.oEmpresaUsuarioPerfilModel_A03_perfil_paraviverbem}]];
		document.getElementById("ct_A03_PERFIL_PARAVIVERBEM").value = txtAux;
		txtAux = [[${pagina.oEmpresaUsuarioPerfilModel_A03_perfil_administrador}]];
		document.getElementById("ct_A03_PERFIL_ADMINISTRADOR").value = txtAux;
		txtAux = [[${pagina.oEmpresaUsuarioPerfilModel_A03_perfil_chefe}]];
		document.getElementById("ct_A03_PERFIL_CHEFE").value = txtAux;
		txtAux = [[${pagina.oEmpresaUsuarioPerfilModel_A03_perfil_padrao}]];
		document.getElementById("ct_A03_PERFIL_PADRAO").value = txtAux;
	}
	// ############################################
	enviarPdLogin(2);
}
</script>
</body>
</html>
