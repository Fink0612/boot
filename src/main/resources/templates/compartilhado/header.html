<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="conteudo">

<form id="pdHeader" action="#" method="post">
<input type="hidden" name="pdUsuSessao" id="pdUsuSessao" value="" />
<input type="hidden" name="pdNomeUsuSessao" id="pdNomeUsuSessao" value="" />
<input type="hidden" name="pdUsuPerfil" id="pdUsuPerfil" value="" />
<input type="hidden" name="pdStatusSessao" id="pdStatusSessao" value="" />
</form>
<table class="tabHead" style="padding:8px; background-color:#006e6e; color:#f5f5f5; width:100%; height: 50px;">
<tr>
<td style="font-size:30px; font-family:arial;">Software Zeen Storm
<img th:src="@{/compartilhado/images/logoszs.png}" width="06%"/>
</td>
<td style="font-size:15px; text-align:right; vertical-align:middle;">
<span id="txt_user_session" style="font-weight:bold;"></span>&nbsp;&nbsp;&nbsp;
<span id="botao_sair" style="display:none;">
<button type="button" onclick="sairSessao();" class="btn-sair-paradecision">Logout</button>
</span>
</td>
</tr>
</table>
<script type="text/javascript" th:inline="javascript">
	var pdUsuSessao = document.getElementById("pdUsuSessao");
	var pdNomeUsuSessao = document.getElementById("pdNomeUsuSessao");
	var pdStatusSessao = document.getElementById("pdStatusSessao");
	var txt_user_session = document.getElementById("txt_user_session");
	if (pdUsuSessao.value == "") {
		pdNomeUsuSessao.value = "LOGIN DO USUÁRIO";
		pdStatusSessao.value = "offline";
	}
	txt_user_session.innerHTML = pdNomeUsuSessao.value.toUpperCase();
</script>

</th:block>
