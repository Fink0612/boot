
<!DOCTYPE html>

<body>

<td>&nbsp;</td>
<td style="text-align:right;"><span class="stlCodForm">intUsuEmp</span></td>

<form id="interUsuarioEmpresasForm" action="#" method="post">
<th:block th:replace="~{compartilhado/camposControle :: conteudo}"></th:block>

<script type="text/javascript" th:inline="javascript">
var achouEmpresa = [[${pagina.achouEmpresa}]];
var rotaProximaTela = "../usuarios/UsuarioEmpresas";
if (achouEmpresa == "1") {
	iue_txt = [[${pagina.oEmpresaUsuarioPerfilModel_A03_perfil_paraviverbem}]];
	document.getElementById("ct_A03_PERFIL_PARAVIVERBEM").value = iue_txt;
	iue_txt = [[${pagina.oEmpresaUsuarioPerfilModel_A03_perfil_administrador}]];
	document.getElementById("ct_A03_PERFIL_ADMINISTRADOR").value = iue_txt;
	iue_txt = [[${pagina.oEmpresaUsuarioPerfilModel_A03_perfil_chefe}]];
	document.getElementById("ct_A03_PERFIL_CHEFE").value = iue_txt;
	iue_txt = [[${pagina.oEmpresaUsuarioPerfilModel_A03_perfil_padrao}]];
	document.getElementById("ct_A03_PERFIL_PADRAO").value = iue_txt;
	rotaProximaTela = "../empresas/EmpresaAgendas";
}

document.getElementById("interUsuarioEmpresasForm").action = rotaProximaTela;
